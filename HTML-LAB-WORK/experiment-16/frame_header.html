<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Top Header Frame (20%)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="margin: 0; padding: 0.75rem 1.5rem; font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #334155; box-sizing: border-box; height: 100vh; overflow: hidden;">

  <!-- Left: Logo & University Title -->
  <div style="display: flex; align-items: center; gap: 1rem;">
    <div style="background: linear-gradient(135deg, #6366f1, #38bdf8); color: #ffffff; width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; font-weight: 800; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);">
      ⚡
    </div>
    <div>
      <h1 style="margin: 0; font-size: 1.25rem; font-weight: 800; color: #ffffff; letter-spacing: -0.5px;">
        Amity University &bull; Department of Computer Applications
      </h1>
      <p style="margin: 0.15rem 0 0 0; font-size: 0.82rem; color: #94a3b8;">
        CSIT248: Advanced Web Technology &bull; Experiment 16: HTML Frames Using Percentage
      </p>
    </div>
  </div>

  <!-- Right: Percentage Badge & Navigation Indicator -->
  <div style="display: flex; align-items: center; gap: 0.75rem;">
    <span style="background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); padding: 0.3rem 0.75rem; border-radius: 9999px; font-size: 0.78rem; font-weight: 700;">
      Top Frame: rows="20%"
    </span>
    <a href="../index.html" target="_top"
      style="background: #6366f1; color: #ffffff; padding: 0.35rem 0.85rem; border-radius: 6px; text-decoration: none; font-size: 0.82rem; font-weight: 600;">
      &larr; All Experiments
    </a>
  </div>

</body>
</html>
