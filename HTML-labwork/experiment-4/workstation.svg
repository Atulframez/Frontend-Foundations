<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="towerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6366f1" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background / Room & Desk -->
  <rect width="800" height="300" fill="#0f172a" />
  <!-- Desk surface -->
  <rect y="300" width="800" height="200" fill="#1e293b" />
  <line x1="0" y1="300" x2="800" y2="300" stroke="#475569" stroke-width="3" />
  <!-- Desk mat -->
  <rect x="180" y="320" width="490" height="150" rx="12" fill="#090d16" stroke="#334155" stroke-width="2" />

  <!-- 1. MONITOR (220, 60) to (580, 280) -->
  <!-- Monitor Stand -->
  <rect x="375" y="270" width="50" height="45" fill="#475569" rx="3" />
  <ellipse cx="400" cy="315" rx="55" ry="12" fill="#334155" stroke="#64748b" stroke-width="2" />
  <!-- Monitor Bezel -->
  <rect x="220" y="60" width="360" height="210" rx="10" fill="#1e293b" stroke="#6366f1" stroke-width="3" filter="url(#glow)" />
  <!-- Monitor Screen Display -->
  <rect x="230" y="70" width="340" height="190" rx="6" fill="url(#screenGrad)" />
  <!-- Screen Graphic Code lines -->
  <circle cx="250" cy="90" r="4" fill="#ef4444" />
  <circle cx="262" cy="90" r="4" fill="#f59e0b" />
  <circle cx="274" cy="90" r="4" fill="#10b981" />
  <rect x="250" y="110" width="120" height="10" rx="3" fill="#ffffff" opacity="0.8" />
  <rect x="270" y="130" width="180" height="8" rx="2" fill="#93c5fd" opacity="0.7" />
  <rect x="270" y="145" width="140" height="8" rx="2" fill="#93c5fd" opacity="0.7" />
  <rect x="250" y="165" width="80" height="8" rx="2" fill="#cbd5e1" opacity="0.6" />
  <!-- Screen text -->
  <text x="400" y="210" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="16" text-anchor="middle">4K UltraWide Monitor</text>
  <text x="400" y="230" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">[Area Shape: RECT]</text>

  <!-- 2. KEYBOARD (240, 330) to (560, 420) -->
  <rect x="240" y="330" width="320" height="90" rx="8" fill="#111827" stroke="#475569" stroke-width="2" />
  <!-- Keycaps representation -->
  <g fill="#1f2937" stroke="#374151" stroke-width="1">
    <!-- Row 1 -->
    <rect x="250" y="338" width="22" height="12" rx="2" />
    <rect x="276" y="338" width="22" height="12" rx="2" />
    <rect x="302" y="338" width="22" height="12" rx="2" />
    <rect x="328" y="338" width="22" height="12" rx="2" />
    <rect x="354" y="338" width="22" height="12" rx="2" />
    <rect x="380" y="338" width="22" height="12" rx="2" />
    <rect x="406" y="338" width="22" height="12" rx="2" />
    <rect x="432" y="338" width="22" height="12" rx="2" />
    <rect x="458" y="338" width="22" height="12" rx="2" />
    <rect x="484" y="338" width="22" height="12" rx="2" />
    <rect x="510" y="338" width="40" height="12" rx="2" fill="#3b82f6" />
    <!-- Row 2 -->
    <rect x="250" y="355" width="28" height="12" rx="2" />
    <rect x="282" y="355" width="22" height="12" rx="2" />
    <rect x="308" y="355" width="22" height="12" rx="2" />
    <rect x="334" y="355" width="22" height="12" rx="2" />
    <rect x="360" y="355" width="22" height="12" rx="2" />
    <rect x="386" y="355" width="22" height="12" rx="2" />
    <rect x="412" y="355" width="22" height="12" rx="2" />
    <rect x="438" y="355" width="22" height="12" rx="2" />
    <rect x="464" y="355" width="22" height="12" rx="2" />
    <rect x="490" y="355" width="60" height="12" rx="2" fill="#06b6d4" />
    <!-- Row 3 & Spacebar -->
    <rect x="250" y="372" width="34" height="12" rx="2" />
    <rect x="288" y="372" width="22" height="12" rx="2" />
    <rect x="314" y="372" width="22" height="12" rx="2" />
    <rect x="340" y="372" width="22" height="12" rx="2" />
    <rect x="366" y="372" width="22" height="12" rx="2" />
    <rect x="392" y="372" width="22" height="12" rx="2" />
    <rect x="418" y="372" width="22" height="12" rx="2" />
    <rect x="444" y="372" width="22" height="12" rx="2" />
    <rect x="470" y="372" width="80" height="12" rx="2" fill="#ec4899" />
    <!-- Spacebar Row -->
    <rect x="250" y="390" width="30" height="16" rx="2" />
    <rect x="285" y="390" width="30" height="16" rx="2" />
    <rect x="320" y="390" width="160" height="16" rx="3" fill="#374151" />
    <rect x="485" y="390" width="30" height="16" rx="2" />
    <rect x="520" y="390" width="30" height="16" rx="2" />
  </g>
  <text x="400" y="415" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Mechanical Keyboard [RECT]</text>

  <!-- 3. MOUSE (Center 630, 375, Radius 35) -->
  <circle cx="630" cy="375" r="35" fill="none" stroke="#06b6d4" stroke-dasharray="3,3" opacity="0.6" />
  <!-- Mouse body -->
  <path d="M 610 350 C 610 335, 650 335, 650 350 L 652 390 C 652 405, 608 405, 608 390 Z" fill="#1e293b" stroke="#06b6d4" stroke-width="2" />
  <line x1="630" y1="337" x2="630" y2="365" stroke="#475569" stroke-width="1.5" />
  <!-- Scroll wheel -->
  <rect x="627" y="345" width="6" height="12" rx="2" fill="#06b6d4" />
  <text x="630" y="420" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Mouse [CIRCLE]</text>

  <!-- 4. COFFEE MUG (Center 150, 360, Radius 35) -->
  <circle cx="150" cy="360" r="35" fill="none" stroke="#f59e0b" stroke-dasharray="3,3" opacity="0.6" />
  <!-- Mug Body -->
  <ellipse cx="145" cy="340" rx="20" ry="8" fill="#d97706" />
  <ellipse cx="145" cy="340" rx="16" ry="6" fill="#78350f" />
  <path d="M 125 340 L 125 380 C 125 390, 165 390, 165 380 L 165 340 Z" fill="#b45309" stroke="#d97706" stroke-width="1" />
  <!-- Handle -->
  <path d="M 165 350 C 180 350, 180 375, 165 375" fill="none" stroke="#d97706" stroke-width="4" stroke-linecap="round" />
  <!-- Steam lines -->
  <path d="M 138 330 Q 142 320 138 310" stroke="#fef3c7" stroke-width="1.5" fill="none" opacity="0.6" />
  <path d="M 148 330 Q 152 320 148 310" stroke="#fef3c7" stroke-width="1.5" fill="none" opacity="0.6" />
  <text x="150" y="415" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Coffee Mug [CIRCLE]</text>

  <!-- 5. PC TOWER (640, 70) to (760, 300) [POLY: 640,70 760,70 760,300 640,300] -->
  <rect x="640" y="70" width="120" height="230" rx="6" fill="url(#towerGrad)" stroke="#818cf8" stroke-width="2" />
  <!-- Power button -->
  <circle cx="700" cy="95" r="7" fill="#10b981" />
  <!-- Front mesh/fan vents -->
  <circle cx="700" cy="150" r="35" fill="#0f172a" stroke="#6366f1" stroke-width="2" />
  <circle cx="700" cy="150" r="28" fill="none" stroke="#06b6d4" stroke-dasharray="8,4" />
  <circle cx="700" cy="235" r="35" fill="#0f172a" stroke="#6366f1" stroke-width="2" />
  <circle cx="700" cy="235" r="28" fill="none" stroke="#06b6d4" stroke-dasharray="8,4" />
  <text x="700" y="288" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">PC TOWER [POLY/RECT]</text>

  <!-- 6. HEADPHONES [POLY: 60,110 120,70 170,110 170,220 120,250 60,220] -->
  <!-- Headband -->
  <path d="M 75 180 C 75 100, 165 100, 165 180" fill="none" stroke="#ec4899" stroke-width="10" stroke-linecap="round" />
  <path d="M 85 180 C 85 110, 155 110, 155 180" fill="none" stroke="#374151" stroke-width="4" />
  <!-- Left Ear Cup -->
  <rect x="60" y="170" width="22" height="45" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="2" />
  <!-- Right Ear Cup -->
  <rect x="158" y="170" width="22" height="45" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="2" />
  <text x="120" y="240" fill="#f472b6" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Headphones [POLY]</text>

  <!-- Coordinate system labels & overlay -->
  <text x="15" y="25" fill="#64748b" font-family="monospace" font-size="12">Interactive Image Map (800x500)</text>
</svg>
