<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Experiment 16: Design a web page to create frames using percentage - CSIT248 Advanced Web Technology">
  <title>Experiment 16 - HTML Frames Using Percentage (CSIT248)</title>
</head>

<!-- ==========================================================================
     Master Frameset Layout Using Percentage Dimensions:
     - Outer Rows: 20% (Header), 70% (Middle Content Area), 10% (Footer)
     - Inner Columns (inside middle row): 25% (Left Menu), 75% (Right Display Area)
     ========================================================================== -->
<frameset rows="20%, 70%, 10%" border="3" bordercolor="#334155" framespacing="3">
  
  <!-- 1. Top Header Frame (20% Height) -->
  <frame src="frame_header.html" name="top_frame" noresize="noresize" scrolling="no" title="Top Header Frame (20%)">
  
  <!-- 2. Middle Nested Frameset: Split into 25% Navigation and 75% Content -->
  <frameset cols="25%, 75%" border="3" bordercolor="#334155" framespacing="3">
    <!-- Left Navigation Frame (25% Width) -->
    <frame src="frame_menu.html" name="menu_frame" scrolling="auto" title="Left Navigation Menu Frame (25%)">
    
    <!-- Right Main Content Frame (75% Width, Target of menu links) -->
    <frame src="frame_content.html" name="content_frame" scrolling="auto" title="Right Main Content Frame (75%)">
  </frameset>
  
  <!-- 3. Bottom Footer Frame (10% Height) -->
  <frame src="frame_footer.html" name="footer_frame" noresize="noresize" scrolling="no" title="Bottom Footer Frame (10%)">

  <!-- Fallback for non-supporting browsers -->
  <noframes>
    <body style="margin: 0; padding: 2rem; font-family: 'Inter', system-ui, sans-serif; background-color: #0f172a; color: #f8fafc; text-align: center;">
      <div style="max-width: 600px; margin: 3rem auto; background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 2rem;">
        <h2 style="color: #38bdf8; margin: 0 0 1rem 0;">HTML Frameset Notice</h2>
        <p style="color: #cbd5e1; font-size: 0.95rem; margin-bottom: 1.5rem;">
          Your current browser does not support traditional HTML <code>&lt;frameset&gt;</code> tags. You can access individual frame components below:
        </p>
        <div style="display: flex; flex-direction: column; gap: 0.75rem;">
          <a href="frame_header.html" style="color: #818cf8; text-decoration: none; font-weight: 600;">1. Top Header Frame (20%)</a>
          <a href="frame_menu.html" style="color: #818cf8; text-decoration: none; font-weight: 600;">2. Navigation Menu Frame (25%)</a>
          <a href="frame_content.html" style="color: #818cf8; text-decoration: none; font-weight: 600;">3. Main Content Frame (75%)</a>
          <a href="frame_footer.html" style="color: #818cf8; text-decoration: none; font-weight: 600;">4. Footer Frame (10%)</a>
        </div>
      </div>
    </body>
  </noframes>

</frameset>
</html>
