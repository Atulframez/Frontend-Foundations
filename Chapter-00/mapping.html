!DOCTYPE html>
<html>
<head>
    <title>Image Mapping</title>
</head>

<body style="background-color:white; color:black; font-family:Arial;">

    <h1 style="text-align:center;">IMAGE MAPPING</h1>

    <p style="text-align:center;">
        Click on different parts of the image to visit different pages.
    </p>

    <center>

        <img
            src="data:i<mage/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' width='600' height='400'%3E
            %3Crect width='600' height='400' fill='white'/%3E
            %3Crect x='100' y='40' width='400' height='220' fill='lightgray' stroke='black' stroke-width='5'/%3E
            %3Crect x='130' y='70' width='340' height='150' fill='skyblue' stroke='black' stroke-width='3'/%3E
            %3Crect x='250' y='260' width='100' height='30' fill='gray' stroke='black' stroke-width='3'/%3E
            %3Crect x='140' y='290' width='320' height='55' fill='lightgray' stroke='black' stroke-width='4'/%3E
            %3Cellipse cx='510' cy='315' rx='30' ry='45' fill='lightgray' stroke='black' stroke-width='4'/%3E
            %3C/svg%3E"
            
            alt="Computer Image"
            width="600"
            height="400"
            usemap="#computerMap"
            style="border:2px solid black;"
        >

        <map name="computerMap">

            <!-- Monitor -->
            <area
                shape="rect"
                coords="100,40,500,260"
                href="https://www.google.com"
                alt="Monitor"
                title="Click Monitor - Google"
            >

            <!-- Keyboard -->
            <area
                shape="rect"
                coords="140,290,460,345"
                href="https://www.wikipedia.org"
                alt="Keyboard"
                title="Click Keyboard - Wikipedia"
            >

            <!-- Mouse -->
            <area
                shape="circle"
                coords="510,315,45"
                href="https://github.com"
                alt="Mouse"
                title="Click Mouse - GitHub"
            >

        </map>

    </center>

    <hr>

    <p style="text-align:center;">
        <b>Image Map Demonstration</b>
    </p>

</body>
</html>
